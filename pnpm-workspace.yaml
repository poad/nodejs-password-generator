packages:
  - .
  - package/core
  - example
  - example/cdk

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  esbuild: false
  protobufjs: false
  unrs-resolver: false

blockExoticSubdeps: true

engineStrict: true

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.12.1

overrides:
  semver: '>=7'
  seroval@<=1.6.2: ^1.6.3

trustPolicy: no-downgrade

injectWorkspacePackages: true
