packages:
  - .
  - package/core
  - example
  - example/cdk

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  esbuild: false
  protobufjs: false
  unrs-resolver: false

blockExoticSubdeps: true

engineStrict: true

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.21.0
  - '@solid-primitives/clipboard@2.0.0'
  - '@solid-primitives/utils@7.0.0'
  - '@solidjs/signals@2.0.3'
  - '@solidjs/compiler@2.0.1'
  - '@solidjs/compiler-darwin-arm64@2.0.1'
  - '@solidjs/compiler-darwin-x64@2.0.1'
  - '@solidjs/compiler-linux-arm64-gnu@2.0.1'
  - '@solidjs/compiler-linux-x64-gnu@2.0.1'
  - '@solidjs/compiler-wasm32-wasi@2.0.1'
  - '@solidjs/compiler-win32-x64-msvc@2.0.1'
  - '@solidjs/vite-plugin@3.0.1'
  - '@solidjs/web@2.0.3'
  - eslint-plugin-solid@0.20.0
  - solid-js@2.0.3

overrides:
  '@solidjs/compiler': 2.0.1
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'
  seroval@<=1.6.2: ^1.6.3

trustPolicy: no-downgrade

injectWorkspacePackages: true
